name: Build Mayhem ARM64 APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare inputs (extract RAR/7z/ZIP, find project and original APK)
        run: |
            set -uo pipefail
            SZ=$(command -v 7zz || command -v 7z || true)
            if ! command -v 7zz >/dev/null 2>&1; then   # 7-Zip 23+ (7zz) reads RAR5 and split RAR volumes; old p7zip does not
              SUDO=""; [ "$(id -u)" != 0 ] && SUDO=sudo
              $SUDO apt-get update -qq
              $SUDO apt-get install -y -qq 7zip >/dev/null 2>&1 || $SUDO apt-get install -y -qq p7zip-full p7zip-rar >/dev/null 2>&1
            fi
            SZ=$(command -v 7zz || command -v 7z || true)
            [ -z "$SZ" ] && { echo "::error::Brak programu 7-Zip na runnerze"; exit 1; }
            echo "Archiwizator: $SZ"
            echo "=== Zawartość repozytorium (przed rozpakowaniem) ==="
            find . -path ./.git -prune -o -type f -printf '%10s  %p\n' | head -60
            DONE="$RUNNER_TEMP/extracted.txt"; : > "$DONE"
            for round in 1 2 3; do
              found=0
              while IFS= read -r a; do
                [ -z "$a" ] && continue
                grep -qxF "$a" "$DONE" && continue
                echo "Rozpakowuję: $a"
                if "$SZ" x -y -aoa "-o$(dirname "$a")" "$a" >"$RUNNER_TEMP/7z.log" 2>&1; then found=1; else echo "::warning::Nie udało się rozpakować $a"; tail -5 "$RUNNER_TEMP/7z.log"; fi
                echo "$a" >> "$DONE"
              done < <(find . -path ./.git -prune -o -type f \( -iname '*.rar' -o -iname '*.7z' -o -iname '*.zip' -o -iname '*.7z.001' -o -iname '*.zip.001' \) -print | grep -v -i -E '\.part0*([2-9]|[1-9][0-9]+)\.rar$|\.(7z|zip)\.0*([2-9]|[1-9][0-9]+)$|/third_party/')
              [ "$found" = 1 ] || break
            done
            SRC=$(find . -path ./.git -prune -o -type f -name bridge_android.cpp -path '*/src/*' -print | head -1)
            if [ -z "$SRC" ]; then
              echo "::error::Nie znaleziono projektu (plik src/bridge_android.cpp). Rozpakuj całość MayhemBridge do repo albo dodaj archiwa RAR/7z/ZIP z projektem."
              find . -path ./.git -prune -o -type f -print | head -80; exit 1
            fi
            PROJ=$(cd "$(dirname "$SRC")/.." && pwd)
            echo "Projekt: $PROJ"
            APK=$(find . -path ./.git -prune -o -type f -iname '*.apk' -size +5M -print | grep -v -E '/(build|work_apk)/' | head -1)
            if [ -z "$APK" ]; then
              echo "::error::Nie znaleziono oryginalnego Mayhem.apk (plik .apk większy niż 5 MB). Dodaj go do repo (np. input/Mayhem.apk) albo w archiwum RAR."
              find . -path ./.git -prune -o -type f -print | head -80; exit 1
            fi
            APK=$(cd "$(dirname "$APK")" && pwd)/$(basename "$APK")
            unzip -l "$APK" | grep -q 'assets/libs/armeabi-v7a/libunity.so' || { echo "::error::$APK nie wygląda jak oryginalny Mayhem.apk (brak assets/libs/armeabi-v7a/libunity.so)"; exit 1; }
            echo "APK: $APK"
            echo "PROJ=$PROJ" >> "$GITHUB_ENV"; echo "SRC_APK=$APK" >> "$GITHUB_ENV"
      - name: Fetch Dynarmic (ARM32 to ARM64 recompiler)
        run: |
            set -e
            for i in 1 2 3; do
              rm -rf "$PROJ/third_party/dynarmic"
              git clone --recursive --depth 1 --shallow-submodules https://github.com/azahar-emu/dynarmic.git "$PROJ/third_party/dynarmic" && break
              echo "clone failed, retry $i"; sleep 8
            done
            test -f "$PROJ/third_party/dynarmic/CMakeLists.txt"
      - name: Build bridge (arm64-v8a, Android NDK)
        run: |
            set -eo pipefail
            sudo apt-get install -y -qq ninja-build >/dev/null 2>&1 || true
            NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
            [ -z "$NDK" ] && NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
            echo "NDK: $NDK"
            cd "$PROJ"
            cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$RUNNER_TEMP/cmake.log"
            cmake --build build -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -30
            ls -la build/libunity.so build/libmono.so
      - name: Show first build errors
        if: failure()
        run: |
            echo "=== Pierwsze błędy kompilacji / konfiguracji ==="
            grep -n -i -E "error|fatal|undefined reference|CMake Error" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/cmake.log" 2>/dev/null | head -40 || true
      - name: Pack, align and sign APK
        run: |
            set -e
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); export PATH="$BT:$PATH"
            curl -sL -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
            cd "$PROJ"
            python3 tools/pack_apk.py --apk "$SRC_APK" --bridge-dir build --out "$GITHUB_WORKSPACE/Mayhem_arm64.apk" --apktool "$RUNNER_TEMP/apktool.jar"
            ls -la "$GITHUB_WORKSPACE/Mayhem_arm64.apk"
      - name: Collect logs
        if: always()
        run: |
            mkdir -p "$GITHUB_WORKSPACE/_logs"; cp "$RUNNER_TEMP"/*.log "$GITHUB_WORKSPACE/_logs/" 2>/dev/null || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayhem_arm64_apk
          path: Mayhem_arm64.apk
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: _logs
          if-no-files-found: ignore
          
